# Tag each main-branch push with its UTC time and unique workflow run/attempt.
# These identify source snapshots, not proof of activation on a machine.
# Tags are pushed back to the repo using the default
# GITHUB_TOKEN with explicit `contents: write` scope.
name: Tag Commit with Timestamp

on:
  push:
    branches:
      - main

# Independent tag names allow every push to run without a shared pending slot.

# Restrict the implicit GITHUB_TOKEN to the minimum scope this job needs.
permissions:
  contents: write

jobs:
  timestamp-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate timestamp tag
        run: |
          TAG_NAME="$(date -u +'%Y-%m-%d-%H-%M-%S')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"
